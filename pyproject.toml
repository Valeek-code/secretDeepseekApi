[tool.poetry]
name = "llm-assistant"
version = "0.1.0"
description = "LLM assistant: code editor + prompt tools"
authors = ["You"]
packages = [{ include = "*", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
PySide6 = "^6.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pyinstaller = "^6.22.3"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
